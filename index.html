<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THTCat — Verified 1-on-1 Cat Sitting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --ink:#1c2a2e; --sub:#4d5d62; --mute:#7a878b; --line:#e8e1d7; --line2:#f1ece4;
  --bg:#fbf8f3; --card:#ffffff; --teal:#0e6b66; --teal-d:#0a4f4b; --teal-s:#e2f1ee;
  --orange:#e5733a; --orange-s:#fdeee4; --green:#1f8a4c; --green-s:#e3f4ea;
  --amber:#a86a00; --amber-s:#fdf3dc; --rose:#c23b4a; --rose-s:#fbe7e9;
  --r:16px; --shadow:0 1px 2px rgba(28,42,46,.05),0 6px 24px rgba(28,42,46,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0;letter-spacing:-.01em}
a{color:inherit}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.demo-bar{background:var(--ink);color:#f4efe7;font-size:12.5px;text-align:center;padding:7px 12px}
.demo-bar b{color:#ffcfae;font-weight:600}
.demo-bar button{background:none;border:1px solid #ffffff44;color:#fff;border-radius:99px;padding:1px 10px;margin-left:8px;font-size:12px}
header.top{position:sticky;top:0;z-index:40;background:rgba(251,248,243,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:22px;height:66px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:"Bricolage Grotesque";font-weight:800;font-size:22px;color:var(--teal-d)}
.logo span{color:var(--orange)}
.nav-links{display:flex;gap:4px;margin-left:12px}
.nav-links a{text-decoration:none;padding:8px 12px;border-radius:10px;color:var(--sub);font-weight:500;font-size:14.5px}
.nav-links a:hover{background:var(--line2);color:var(--ink)}
.nav-links a.on{color:var(--teal-d);background:var(--teal-s)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pts-chip{display:flex;align-items:center;gap:6px;background:var(--orange-s);color:#9a4517;font-weight:600;font-size:13px;padding:6px 11px;border-radius:99px;text-decoration:none}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:13.5px;font-weight:500}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14.5px;text-decoration:none;transition:transform .08s, background .15s}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--teal);color:#fff}.btn-p:hover{background:var(--teal-d)}
.btn-o{background:var(--orange);color:#fff}.btn-o:hover{background:#cf6230}
.btn-g{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn-g:hover{background:var(--line2)}
.btn-ghost{background:none;color:var(--teal-d);padding:8px 10px}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.muted{color:var(--mute)} .sub{color:var(--sub)}
.small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.grid{display:grid;gap:18px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-teal{background:var(--teal-s);color:var(--teal-d)} .b-or{background:var(--orange-s);color:#9a4517}
.b-green{background:var(--green-s);color:var(--green)} .b-amber{background:var(--amber-s);color:var(--amber)}
.b-rose{background:var(--rose-s);color:var(--rose)} .b-gray{background:var(--line2);color:var(--sub)}
.section{padding:56px 0}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
.h-xl{font-size:clamp(34px,5vw,56px);line-height:1.04;font-weight:800}
.h-l{font-size:clamp(26px,3vw,34px);font-weight:800;line-height:1.15}
.h-m{font-size:20px;font-weight:700}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--sub);margin-bottom:5px}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;font-size:14.5px;outline:none}
.inp:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-s)}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.stars{color:#e5a11a;letter-spacing:1px}
/* hero */
.hero{padding:48px 0 30px;position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero p.lead{font-size:18px;color:var(--sub);max-width:520px;margin:18px 0 26px}
.searchbox{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:10px;padding:12px;align-items:end}
.hero-art{position:relative;aspect-ratio:1/1;border-radius:28px;overflow:hidden;background:#f3d9c2}
.float-card{position:absolute;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:10px 13px;font-size:13px;display:flex;gap:10px;align-items:center}
.live-dot{width:8px;height:8px;border-radius:50%;background:#e23d3d;box-shadow:0 0 0 0 #e23d3d88;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #e23d3d88}70%{box-shadow:0 0 0 8px #e23d3d00}100%{box-shadow:0 0 0 0 #e23d3d00}}
.stats{display:flex;gap:28px;margin-top:26px;flex-wrap:wrap}
.stats b{font-family:"Bricolage Grotesque";font-size:26px;display:block}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step-n{width:34px;height:34px;border-radius:10px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:12px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--teal-s);color:var(--teal-d);margin-bottom:12px}
.pricing{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.price-card{position:relative}
.price-card .amt{font-family:"Bricolage Grotesque";font-size:32px;font-weight:800}
.price-card.pop{border:2px solid var(--orange)}
.pop-tag{position:absolute;top:-11px;left:18px;background:var(--orange);color:#fff;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}
.cmp th{font-size:12.5px;color:var(--mute);font-weight:600}
.cmp td.y{color:var(--green);font-weight:600}.cmp td.n{color:var(--rose)}
.promo{background:linear-gradient(120deg,var(--teal-d),var(--teal));color:#fff;border-radius:24px;padding:34px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center}
.code{font-family:ui-monospace,Menlo,monospace;background:#ffffff22;border:1px dashed #ffffff88;padding:6px 12px;border-radius:9px;font-weight:700;letter-spacing:.05em}
footer{border-top:1px solid var(--line);padding:34px 0 50px;margin-top:40px;color:var(--mute);font-size:13px}
/* listing */
.list-layout{display:grid;grid-template-columns:270px 1fr;gap:24px;padding:28px 0}
.filters{position:sticky;top:86px;align-self:start}
.filters h4{font-size:14px;margin:16px 0 8px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0;cursor:pointer}
.chk input{accent-color:var(--teal);width:16px;height:16px}
.sitter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.s-card{overflow:hidden;cursor:pointer;transition:transform .15s, box-shadow .15s}
.s-card:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(28,42,46,.1)}
.s-img{aspect-ratio:16/10;position:relative;background:#eee}
.s-img svg{width:100%;height:100%;display:block}
.s-img .badge{position:absolute;top:10px;left:10px}
.fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:#ffffffe6;display:grid;place-items:center}
.fav.on svg{fill:var(--rose);stroke:var(--rose)}
.s-body{padding:14px 16px 16px}
.av-sm{width:44px;height:44px;border-radius:50%;flex:none;border:3px solid #fff;margin-top:-34px;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.12);overflow:hidden}
.av-sm svg,.av-lg svg{width:100%;height:100%;display:block}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* profile */
.crumbs{font-size:13px;color:var(--mute);padding:18px 0 8px}
.crumbs a{text-decoration:none;color:var(--teal-d)}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:180px 180px;gap:8px;border-radius:20px;overflow:hidden}
.gallery > div{position:relative;background:#eee}
.gallery > div:first-child{grid-row:span 2}
.gallery svg{width:100%;height:100%;display:block}
.gallery .cap{position:absolute;left:8px;bottom:8px;background:#000000a0;color:#fff;font-size:11.5px;padding:3px 8px;border-radius:7px}
.prof-layout{display:grid;grid-template-columns:1fr 380px;gap:32px;padding:26px 0}
.av-lg{width:72px;height:72px;border-radius:50%;overflow:hidden;flex:none}
.verify-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v-item{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13.5px}
.v-item .ck{flex:none;width:22px;height:22px;border-radius:50%;background:var(--green-s);color:var(--green);display:grid;place-items:center}
.book-panel{position:sticky;top:86px;align-self:start}
.seg{display:flex;background:var(--line2);border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.cal{user-select:none}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:14.5px}
.cal-nav{border:1px solid var(--line);background:#fff;border-radius:9px;width:32px;height:32px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .dow{font-size:11px;color:var(--mute);font-weight:600;padding:4px 0}
.cal-grid button{border:0;background:none;height:38px;border-radius:9px;font-size:13.5px;position:relative}
.cal-grid button:hover:not([disabled]){background:var(--teal-s)}
.cal-grid button[disabled]{color:#c6c0b7;cursor:not-allowed}
.cal-grid button.blk{text-decoration:line-through;color:#d1a2a8}
.cal-grid button.inr{background:var(--teal-s);border-radius:0}
.cal-grid button.st,.cal-grid button.en{background:var(--teal);color:#fff;font-weight:700;text-decoration:none}
.thumb svg{width:100%;height:100%;display:block}
.stat4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.mob-book{display:none}
.cal-grid button.today::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--orange)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sumline{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.sumline.total{font-weight:700;font-size:17px;padding-top:10px;border-top:1px solid var(--line);margin-top:8px}
.sumline.disc{color:var(--green)}
.rev{padding:16px 0;border-bottom:1px solid var(--line)}
.rev:last-child{border-bottom:0}
/* checkout */
.co-layout{display:grid;grid-template-columns:1fr 380px;gap:28px;padding:26px 0 40px}
.stepper{display:flex;gap:8px;margin:6px 0 20px;flex-wrap:wrap}
.stepper div{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--mute)}
.stepper div span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line2);font-size:12.5px}
.stepper div.on{color:var(--ink)}.stepper div.on span{background:var(--teal);color:#fff}
.stepper div.done span{background:var(--green);color:#fff}
.stepper .ln{width:28px;height:2px;background:var(--line)}
.cat-opt{display:flex;gap:14px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:#fff}
.cat-opt.sel{border-color:var(--teal);background:#f6fbfa}
.cat-opt.bad{opacity:.75;cursor:not-allowed;background:#fcfaf7}
.cat-av{width:54px;height:54px;border-radius:14px;overflow:hidden;flex:none}
.cat-av svg{width:100%;height:100%;display:block}
.addon{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.addon input[type=checkbox]{accent-color:var(--teal);width:18px;height:18px}
.pay-opt{display:flex;gap:12px;align-items:center;padding:14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:#fff}
.pay-opt.sel{border-color:var(--teal);background:#f6fbfa}
.escrow-flow{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}
.escrow-flow div{background:var(--teal-s);color:var(--teal-d);padding:6px 10px;border-radius:9px;font-weight:600}
/* bookings */
.bk-layout{display:grid;grid-template-columns:1fr;gap:16px;padding:28px 0}
.bk-item{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center;padding:14px}
.bk-thumb{width:120px;height:84px;border-radius:12px;overflow:hidden}
.bk-thumb svg{width:100%;height:100%;display:block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 14px;font-weight:600;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--teal-d);border-color:var(--teal)}
.timeline{position:relative;padding-left:4px}
.tl{display:flex;gap:12px;padding-bottom:16px;position:relative}
.tl::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl .dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--line2);color:var(--mute);font-size:12px;z-index:1}
.tl.done .dot{background:var(--green);color:#fff}
.tl.cur .dot{background:var(--teal);color:#fff;box-shadow:0 0 0 4px var(--teal-s)}
.cctv{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
.cctv canvas{width:100%;height:100%;display:block}
.cctv .ov{position:absolute;top:10px;left:12px;color:#fff;font:600 12px ui-monospace,Menlo,monospace;display:flex;gap:8px;align-items:center;text-shadow:0 1px 2px #000}
.cctv .ov2{position:absolute;bottom:10px;right:12px;color:#fff;font:500 12px ui-monospace,Menlo,monospace;text-shadow:0 1px 2px #000}
.locked{display:grid;place-items:center;text-align:center;padding:36px;color:var(--mute);border:1.5px dashed var(--line);border-radius:14px}
.report{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:#fff}
.report .ph{border-radius:10px;overflow:hidden;position:relative;aspect-ratio:4/3}
.report .ph svg{width:100%;height:100%;display:block}
.stamp{position:absolute;left:5px;bottom:5px;background:#000a;color:#fff;font:600 10px ui-monospace,Menlo,monospace;padding:2px 5px;border-radius:4px}
.hash{font:500 11.5px ui-monospace,Menlo,monospace;color:var(--green)}
.chat{display:flex;flex-direction:column;height:420px}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#faf7f2;border-radius:12px}
.msg{max-width:75%;padding:9px 13px;border-radius:14px;font-size:14px}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;color:var(--mute);font-size:12px}
.msg .t{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.chat-in{display:flex;gap:8px;margin-top:10px}
.demo-ctrl{border:1.5px dashed var(--orange);background:#fffaf5;border-radius:14px;padding:14px}
.star-pick button{background:none;border:0;font-size:28px;color:#ddd;padding:0 2px}
.star-pick button.on{color:#e5a11a}
/* rewards */
.rw-hero{background:linear-gradient(120deg,#fff3e9,#fde3d1);border-radius:24px;padding:28px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;border:1px solid #f6d3bd}
.rw-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ticket{border:1.5px dashed var(--orange);border-radius:12px;padding:8px 12px;font:700 14px ui-monospace,Menlo,monospace;color:#9a4517;background:#fff}
/* sitter app */
.req{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.req:last-child{border:0}
.up{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px}
.up input{display:none}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,33,.5);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:20px;max-width:460px;width:100%;padding:24px;max-height:90vh;overflow:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.spin{width:18px;height:18px;border:2.5px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.qr{width:180px;height:180px;margin:0 auto;display:block}
.empty{text-align:center;padding:50px 20px;color:var(--mute)}
.mob-menu{display:none}
@media (max-width:960px){
  .hero-grid,.prof-layout,.co-layout,.promo{grid-template-columns:1fr}
  .steps,.trust,.pricing{grid-template-columns:1fr 1fr}
  .list-layout{grid-template-columns:1fr}
  .filters{position:static}
  .book-panel{position:static}
  .rw-grid{grid-template-columns:1fr 1fr}
  .nav-links{display:none}
  .menu-btn{display:block}
  .mob-menu.open{display:flex;flex-direction:column;padding:8px 20px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
  .mob-menu a{padding:10px 0;text-decoration:none;font-weight:600;border-bottom:1px solid var(--line2)}
  .searchbox{grid-template-columns:1fr 1fr}
  .searchbox .btn{grid-column:span 2}
}
@media (max-width:600px){
  .steps,.trust,.pricing,.rw-grid,.verify-list{grid-template-columns:1fr}
  .gallery{grid-template-columns:1fr 1fr;grid-template-rows:200px 110px}
  .gallery > div:first-child{grid-column:span 2;grid-row:auto}
  .gallery > div:nth-child(n+4){display:none}
  .bk-item{grid-template-columns:80px 1fr}
  .bk-thumb{width:80px;height:64px}
  .bk-item > :last-child{grid-column:span 2}
  .report{grid-template-columns:1fr}
  .stat4{grid-template-columns:1fr 1fr}

<script>
"use strict";
/* =================== helpers =================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht = n => '฿' + Math.round(Number(n)||0).toLocaleString('en-US');
const pad2 = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const nextDay = s => ymd(addDays(parse(s),1));
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtD = s => { if(!s) return ''; const d = parse(s); return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]; };
const fmtDT = t => { const d = new Date(t); return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+' · '+pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); };
const hhmm = t => { const d = new Date(t); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };
let TODAY = ymd(new Date());
function hashStr(s){ let h1=0x811c9dc5, h2=0x1234567; for (let i=0;i<s.length;i++){ h1^=s.charCodeAt(i); h1=Math.imul(h1,16777619); h2=Math.imul(h2^s.charCodeAt(i),2654435761);} return ((h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0')); }
const rid = (p='') => p + Date.now().toString(36).slice(-5).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase();
/* Dialogs and toasts are placed next to where the person last tapped, so they stay visible
   even when the page is shown inside a frame that is taller than the screen. */
let lastY = 120;
document.addEventListener('pointerdown', e=>{ lastY = e.pageY; }, true);
function toast(msg){ const box=$('#toasts'); box.style.top = Math.max(10, lastY+28)+'px'; const t=document.createElement('div'); t.className='toast'; t.textContent=msg; box.appendChild(t); setTimeout(()=>t.remove(),3400); }
function modal(html){
  $('#modalRoot').innerHTML = `<div class="modal-bg" data-a="closeModalBg" style="min-height:${document.documentElement.scrollHeight}px"><div class="modal" style="margin-top:${Math.max(16, lastY-200)}px">${html}</div></div>`;
  requestAnimationFrame(()=>{ const m=$('.modal'); if (m) m.scrollIntoView({block:'nearest'}); });
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
const safeImg = u => (typeof u==='string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u)) ? u : '';
const withTimeout = (p, ms) => Promise.race([p, new Promise(r=>setTimeout(()=>r(null), ms))]);

/* =================== pricing =================== */
const RATE = { hour:30, day:480, week:2856, month:10800 };
function priceDays(n){
  const c=[0], k=[{m:0,w:0,d:0}];
  for (let i=1;i<=n;i++){
    let best = c[i-1]+RATE.day, pick = {...k[i-1], d:k[i-1].d+1};
    const wi=Math.max(0,i-7), w = c[wi]+RATE.week; if (w < best){ best=w; pick={...k[wi],w:k[wi].w+1}; }
    const mi=Math.max(0,i-30), m = c[mi]+RATE.month; if (m < best){ best=m; pick={...k[mi],m:k[mi].m+1}; }
    c[i]=best; k[i]=pick;
  }
  return { total:c[n], ...k[n] };
}
const priceHours = h => Math.min(h*RATE.hour, RATE.day);

/* ---- seasonal / festival pricing ----
   rule: {id, name, type:'season'|'festival', start:'YYYY-MM-DD', end:'YYYY-MM-DD', pct, recurring, active}
   recurring rules ignore the year (a Dec→Jan range wraps). A festival beats a season on the same day. */
let PRICING = { rules: [] };
const DEFAULT_PRICING = { rules: [
  {id:'r-high', name:'High tourist season', type:'season', start:'2026-11-01', end:'2027-02-28', pct:10, recurring:true, active:true},
  {id:'r-low', name:'Rainy low season', type:'season', start:'2026-06-01', end:'2026-09-30', pct:-10, recurring:true, active:true},
  {id:'r-ny', name:'New Year holidays', type:'festival', start:'2026-12-28', end:'2027-01-03', pct:30, recurring:true, active:true},
  {id:'r-songkran', name:'Songkran', type:'festival', start:'2027-04-11', end:'2027-04-17', pct:30, recurring:true, active:true},
  {id:'r-cny27', name:'Chinese New Year 2027', type:'festival', start:'2027-02-05', end:'2027-02-09', pct:20, recurring:false, active:true},
  {id:'r-loy26', name:'Loy Krathong 2026', type:'festival', start:'2026-11-23', end:'2026-11-25', pct:15, recurring:false, active:true},
]};
function ruleHits(r, ds){
  if (!r || r.active===false || !r.start || !r.end) return false;
  if (r.recurring){ const md=ds.slice(5), a=r.start.slice(5), b=r.end.slice(5); return a<=b ? (md>=a && md<=b) : (md>=a || md<=b); }
  return ds>=r.start && ds<=r.end;
}
function dayRule(ds){
  const hits = (PRICING.rules||[]).filter(r=>ruleHits(r, ds));
  if (!hits.length) return null;
  const fest = hits.filter(r=>r.type==='festival'), pool = fest.length ? fest : hits;
  return pool.reduce((a,b)=>Math.abs(Number(b.pct)||0) > Math.abs(Number(a.pct)||0) ? b : a);
}
const dayPct = ds => Number(dayRule(ds)?.pct)||0;
const dayPrice = ds => Math.round(RATE.day*(1+dayPct(ds)/100));
function careFor(start, n){
  const p = priceDays(n), per = p.total/n, byRule = {};
  let adj = 0, d = start;
  for (let i=0;i<n;i++){
    const r = dayRule(d);
    if (r){ const a = per*(Number(r.pct)||0)/100; adj += a; const k=r.name; byRule[k] = byRule[k] || {pct:Number(r.pct)||0, days:0, amt:0}; byRule[k].days++; byRule[k].amt += a; }
    d = nextDay(d);
  }
  Object.values(byRule).forEach(v=>v.amt=Math.round(v.amt));
  return { p, base:p.total, adj:Math.round(adj), total:Math.round(p.total+adj), byRule };
}
const ADDONS = [
  {id:'groom', name:'Brushing & grooming session', price:150, per:'once', desc:'Gentle brushing, nail trim, ear check'},
  {id:'med', name:'Medication administration', price:50, per:'day', desc:'Pills or drops on your schedule (vet document required)'},
  {id:'video', name:'Extra live video call', price:40, per:'day', desc:'A 10-minute call with your cat each evening'},
  {id:'litter', name:'Premium litter change', price:60, per:'once', desc:'Full litter replacement before pick-up'},
];
function quote(b){
  let days=0, care=0, desc='', base=0, season=[];
  if (b.mode==='hours'){
    days=1; base=priceHours(b.hours||0); desc=(b.hours||0)+' hr × ฿30'+((b.hours||0)*30>RATE.day?' (capped at daily rate)':'');
    const r = b.date ? dayRule(b.date) : null; const pct = Number(r?.pct)||0;
    care = Math.round(base*(1+pct/100));
    if (r) season = [{name:r.name, pct, days:1, amt:care-base}];
  }
  else if (b.start && b.end && b.end>b.start){
    days = diffDays(b.start,b.end); const c = careFor(b.start, days); base=c.base; care=c.total; const p=c.p;
    desc = [p.m?p.m+' × Monthly':'', p.w?p.w+' × Weekly':'', p.d?p.d+' × Daily':''].filter(Boolean).join(' + ');
    season = Object.entries(c.byRule).map(([name,v])=>({name, ...v}));
  }
  const addons = (b.addons||[]).map(id=>{ const a=ADDONS.find(x=>x.id===id); return a?{name:a.name, amt:a.per==='day'?a.price*days:a.price}:null; }).filter(Boolean);
  const addonSum = addons.reduce((x,a)=>x+a.amt,0);
  const insure = b.insure ? 199 : 0;
  const food = Math.max(0, Number(b.food)||0);
  let coupon = 0;
  if (b.couponOk) coupon = b.mode==='hours' ? care : Math.min(care, careFor(b.start, 1).total);
  const pre = care + addonSum + insure + food - coupon;
  const pts = b.usePoints ? Math.min(WAL?.points||0, Math.floor(pre*0.5)) : 0;
  const total = Math.max(0, pre - pts);
  const gp = (care + addonSum - coupon) * 0.2;
  const sitterPay = (care + addonSum - coupon) * 0.8 + food;
  return { days, base, care, season, desc, addons, addonSum, insure, food, coupon, pts, total, gp, sitterPay, earn: Math.floor(total/10) };
}

const Store = { mode:'local', me:null, isAdmin:false, db:null, user:null, viewOnly:false };
const LOCAL = { data:null, subs:[] };
const parentOf = p => p.split('/').slice(0,-1).join('/');
function lsLoad(){
  try { LOCAL.data = JSON.parse(localStorage.getItem('thtcat-v2')); } catch(e){ LOCAL.data=null; }
  if (!LOCAL.data){ LOCAL.data = {}; SEED.forEach(s=>{ const {id,...rest}=s; LOCAL.data['sitters/'+id]=rest; }); }

function lsSave(){ try { localStorage.setItem('thtcat-v2', JSON.stringify(LOCAL.data)); } catch(e){} }
const localColl = c => Object.keys(LOCAL.data).filter(k=>parentOf(k)===c).map(k=>({id:k.split('/').pop(), ...LOCAL.data[k]}));
function localEmit(path){
  const c = parentOf(path);
  LOCAL.subs.slice().forEach(s=>{ if (s.t==='c' && s.p===c) s.cb(localColl(c)); if (s.t==='d' && s.p===path) s.cb(LOCAL.data[path] ? {...LOCAL.data[path]} : null); });
}

const CFG = window.THTCAT_CONFIG || null;
const SUPA = { client:null, user:null };
const supaErr = e => Object.assign(new Error(e?.message||'db error'), { code: (e?.code==='42501' || /row-level security|permission/i.test(e?.message||'')) ? 'invalid_argument' : (e?.status>=500 ? 'unavailable' : (e?.code||'error')) });
function supaWatch(filterCol, val, load){
  let alive=true, t=null; const run=()=>{ clearTimeout(t); t=setTimeout(()=>alive&&load(), 60); };
  load();
  const ch = SUPA.client.channel('w-'+rid()).on('postgres_changes', {event:'*', schema:'public', table:'docs', filter:filterCol+'=eq.'+val}, run).subscribe();
  return ()=>{ alive=false; clearTimeout(t); SUPA.client.removeChannel(ch); };
}
Store.watch = (c, cb, onErr) => {
  if (Store.mode==='supa'){ let tries=0; const load = async ()=>{ const {data,error}=await SUPA.client.from('docs').select('path,data').eq('parent', c); if (error){ onErr&&onErr(error); if (!window._dbMissing && tries++<20) setTimeout(load, 3000); return; } cb(data.map(r=>({id:r.path.split('/').pop(), ...r.data}))); }; return supaWatch('parent', c, load); }
  if (false) return supaWatch('parent', c, async ()=>{ const {data,error}=await SUPA.client.from('docs').select('path,data').eq('parent', c); if (error){ onErr&&onErr(error); return; } cb(data.map(r=>({id:r.path.split('/').pop(), ...r.data}))); });
  if (Store.mode==='cloud') return Store.db.collection(c).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id, ...d.data()}))), e=>{ onErr&&onErr(e); });
  const s={t:'c',p:c,cb}; LOCAL.subs.push(s); setTimeout(()=>cb(localColl(c)),0); return ()=>{ LOCAL.subs=LOCAL.subs.filter(x=>x!==s); };
};
Store.watchDoc = (p, cb, onErr) => {
  if (Store.mode==='supa') return supaWatch('path', p, async ()=>{ const {data,error}=await SUPA.client.from('docs').select('data').eq('path', p).maybeSingle(); if (error){ onErr&&onErr(error); return; } cb(data ? {...data.data} : null, {fromCache:false}); });
  if (Store.mode==='cloud') return Store.db.doc(p).onSnapshot(s=>cb(s.exists ? {...s.data()} : null, s.metadata), e=>{ onErr&&onErr(e); });
  const s={t:'d',p,cb}; LOCAL.subs.push(s); setTimeout(()=>cb(LOCAL.data[p]?{...LOCAL.data[p]}:null, {fromCache:false}),0); return ()=>{ LOCAL.subs=LOCAL.subs.filter(x=>x!==s); };
};
const writeQ = {};
async function dbCall(fn, path){
  // one write at a time per document
  const prev = writeQ[path] || Promise.resolve();
  const run = prev.catch(()=>{}).then(fn);
  writeQ[path] = run;
  try { return await run; }
  catch(e){
    const code = e && e.code;
    if (code==='unavailable'){ await new Promise(r=>setTimeout(r, 400+Math.random()*600)); return fn(); }
    if (code==='quota_exceeded') toast('Storage is full — ask the owner to clear old data');
    else if (code==='invalid_argument') toast('You do not have permission to save this');
    else toast('Could not save — please try again');
    throw e;
  }
}
const supaRun = q => q.then(r=>{ if (r.error) throw supaErr(r.error); return r.data; });
Store.set = (p, d) => Store.mode==='supa' ? dbCall(()=>supaRun(SUPA.client.from('docs').upsert({path:p, parent:parentOf(p), data:JSON.parse(JSON.stringify(d))})), p) : Store.mode==='cloud' ? dbCall(()=>Store.db.doc(p).set(d), p) : (LOCAL.data[p]=JSON.parse(JSON.stringify(d)), lsSave(), localEmit(p), Promise.resolve());
Store.update = (p, d) => Store.mode==='supa' ? dbCall(()=>supaRun(SUPA.client.rpc('doc_merge', {p, d:JSON.parse(JSON.stringify(d))})), p) : Store.mode==='cloud' ? dbCall(()=>Store.db.doc(p).update(d), p) : (LOCAL.data[p]={...(LOCAL.data[p]||{}), ...JSON.parse(JSON.stringify(d))}, lsSave(), localEmit(p), Promise.resolve());
Store.del = p => Store.mode==='supa' ? dbCall(()=>supaRun(SUPA.client.from('docs').delete().eq('path', p)), p) : Store.mode==='cloud' ? dbCall(()=>Store.db.doc(p).delete(), p) : (delete LOCAL.data[p], lsSave(), localEmit(p), Promise.resolve());
Store.setQuiet = (p, d) => { try {
  if (Store.mode==='supa') return SUPA.client.from('docs').upsert({path:p, parent:parentOf(p), data:JSON.parse(JSON.stringify(d))}).then(()=>{}, ()=>{});
  if (Store.mode==='cloud') return Store.db.doc(p).set(d).catch(()=>{});
  LOCAL.data[p]=JSON.parse(JSON.stringify(d)); lsSave(); localEmit(p); return Promise.resolve(); } catch(e){ return Promise.resolve(); } };

function dayState(P, ds){
  const past = ds < TODAY, blk = !!P.blocked?.has(ds);
  const choosingEnd = P.mode==='range' && P.start && !P.end;
  if (past) return {off:true, why:'That day has already passed.'};
  if (P.mode==='range'){
    if (choosingEnd && ds>P.start){ if (!rangeFree(P.blocked||new Set(), P.start, ds)) return {off:true, why:'There is a booked day in between. Pick an earlier pick-up day, or tap a new drop-off day first.'}; return {off:false}; }
    if (blk) return {off:true, why:'This sitter is booked or unavailable that day.'};
  } else if (P.mode==='single'){ if (blk) return {off:true, why:'This sitter is booked or unavailable that day.'}; }
  else if (P.mode==='toggle'){ if (P.locked?.has(ds)) return {off:true, why:'A customer has booked this day.'}; }
  return {off:false};
}
function paintMonths(key){
  const P = PICK[key]; if (!P) return;
  $$(`[data-pick="${key}"]`).forEach(b=>{
    const ds = b.dataset.day, past = ds < TODAY, blk = P.blocked?.has(ds), st = dayState(P, ds);
    b.classList.toggle('off', st.off); b.setAttribute('aria-disabled', st.off?'true':'false');
    b.classList.toggle('past', past);
    b.classList.toggle('blk', !!blk && !past && P.mode!=='toggle');
    const sel = P.mode==='range' ? (ds===P.start || ds===P.end) : P.mode==='single' ? ds===P.date : (!!blk && !past);
    b.classList.toggle('st', !!sel);
    b.classList.toggle('inr', P.mode==='range' && !!P.start && !!P.end && ds>P.start && ds<P.end);
  });
}
function pickDay(key, ds){
  const P = PICK[key]; if (!P) return;
  if (P.mode==='single') P.date = ds;
  else if (P.mode==='range'){
    if (!P.start || P.end || ds<=P.start){ P.start=ds; P.end=''; }
    else P.end = ds;
  } else if (P.mode==='toggle'){ P.onToggle && P.onToggle(ds); return; }
  paintMonths(key);
  P.onChange && P.onChange(P);
}
function scrollToMonth(key, ds){

let drag = null;
document.addEventListener('pointerdown', e=>{
  const el = e.target.closest('[data-drag]'); if (!el || e.pointerType!=='mouse' || e.button!==0) return;
  drag = {el, x:e.clientX, sl:el.scrollLeft, moved:false};
});
document.addEventListener('pointermove', e=>{
  if (!drag) return; const dx = e.clientX-drag.x;
  if (Math.abs(dx)>5 && !drag.moved){ drag.moved=true; drag.el.classList.add('drag'); }
  if (drag.moved) drag.el.scrollLeft = drag.sl - dx;

document.addEventListener('pointerup', e=>{
  if (!drag) return; const d = drag; drag=null;
  if (!d.moved) return;
  d.el.classList.remove('drag');
  const w = d.el.firstElementChild?.offsetWidth || d.el.clientWidth;
  const dx = e.clientX - d.x;
  let idx = Math.round(d.sl / w) + (dx < -40 ? 1 : dx > 40 ? -1 : 0);
  d.el.scrollTo({left: Math.max(0, idx*w), behavior:'smooth'});
  window._suppressClick = Date.now();

const WHEEL = {}; // key -> {items, value, onChange}
const IH = 40;
function wheelHTML(key, label, items, value, onChange){
  WHEEL[key] = {items, value, onChange};
  const idx = Math.max(0, items.findIndex(it=>it.v===value));
  return `<div class="wheel-box"><div class="wheel-lab">${label}</div><div class="wheel" data-wheel="${key}" data-ks="w-${key}" data-init="${idx}">${items.map((it,i)=>`<div data-wi="${i}" class="${i===idx?'on':''}">${it.l}</div>`).join('')}</div><div class="wheel-band"></div></div>`;
}
function initWheels(){
  $$('.wheel').forEach(w=>{
    if (w._init) return; w._init = true;
    w.scrollTop = Number(w.dataset.init)*IH;
    let t=null;
    w.addEventListener('scroll', ()=>{
      clearTimeout(t);
      const i = Math.round(w.scrollTop/IH);
      [...w.children].forEach((c,k)=>c.classList.toggle('on', k===i));
      t = setTimeout(()=>{
        const W = WHEEL[w.dataset.wheel]; if (!W) return;
        const it = W.items[Math.max(0, Math.min(W.items.length-1, i))];
        if (it && it.v!==W.value){ W.value = it.v; W.onChange && W.onChange(it.v); }
      }, 110);
    }, {passive:true});
  });
}
const timeItems = (from, to, step) => { const out=[]; for (let m=from*60; m<=to*60; m+=step) out.push({v:pad2(Math.floor(m/60))+':'+pad2(m%60), l:pad2(Math.floor(m/60))+':'+pad2(m%60)}); return out; };

    PICK.book = { mode:'single', date:D.date, blocked, onChange:P=>{ D.date=P.date; renderBookSum(); } };
  }
  const wheels = D.mode==='days'
    ? `<div class="wheels" style="margin-top:12px">${wheelHTML('dropT','DROP-OFF TIME', timeItems(7,20,30), D.dropT, v=>{D.dropT=v; renderBookSum();})}${wheelHTML('pickT','PICK-UP TIME', timeItems(7,20,30), D.pickT, v=>{D.pickT=v; renderBookSum();})}</div>`
    : `<div class="wheels" style="margin-top:12px">${wheelHTML('startT','START TIME', timeItems(7,21,30), D.startT, v=>{D.startT=v; renderBookSum();})}${wheelHTML('hrs','HOURS', Array.from({length:16},(_,i)=>({v:i+1,l:(i+1)+' hr'})), D.hours, v=>{D.hours=v; renderBookSum();})}</div>`;
  el.innerHTML = `
    <div class="row between"><div><span style="font-family:'Bricolage Grotesque';font-size:24px;font-weight:800">${baht(dayPrice(TODAY))}</span> <span class="muted small">/ day today</span>${dayRule(TODAY)?`<div class="tiny" style="color:${dayPct(TODAY)>0?'#b8541c':'var(--green)'}">${esc(dayRule(TODAY).name)} ${dayPct(TODAY)>0?'+':''}${dayPct(TODAY)}%</div>`:''}</div>${s.reviews?`<span class="small"><span class="stars">★</span> ${Number(s.rating).toFixed(2)}</span>`:''}</div>
    <div class="seg" style="margin:14px 0"><button data-mode="days" class="${D.mode==='days'?'on':''}">Overnight stay</button><button data-mode="hours" class="${D.mode==='hours'?'on':''}">Hourly visit</button></div>
    ${monthsHTML('book', false)}
    ${wheels}
    <div id="bpSum"></div>`;
  paintMonths('book'); initWheels(); renderBookSum();
  if (!document.querySelector('[data-ks="m-book"]')._sc){ scrollToMonth('book', D.mode==='days'?D.start:D.date); }
}
function bookValid(){
  if (!D) return false;
  const set = blockedSet(D.sitterId);
  if (D.mode==='hours') return !!D.date && !set.has(D.date) && D.date>=TODAY;
  return !!(D.start && D.end && D.end>D.start && D.start>=TODAY && rangeFree(set, D.start, D.end));
}

async function doPay(btn){
  if (!$('#agree').checked){ toast('Please confirm the booking terms'); return; }
  if (Store.mode!=='local' && !Store.me){ toast('Sign in to book'); return; }
  const q = quote(D);
  const finish = async () => {
    // re-check availability with a short lock so two people can't take the same days
    const got = await Store.lock('locks/'+D.sitterId);
    if (!got){ closeModal(); toast('Someone is booking this sitter right now — try again in a few seconds'); return; }
    if (!bookValid()){ closeModal(); toast('Sorry — those dates were just taken. Please pick other dates.'); go('sitter-'+D.sitterId); return; }
    const id = rid('TC');
    const s = SIT[D.sitterId];
    const catsSnap = D.cats.map(cid=>{ const c=CATS.find(x=>x.id===cid); return {name:c.name, breed:c.breed, age:c.age, sex:c.sex, chip:c.chip, vacc:c.vacc, notes:c.notes||'', color:c.color, bg:c.bg}; });
    const b = { id, ownerUid:Store.me, sitterId:D.sitterId, sitterUid:s.uid||null, catsSnap, cats:[...D.cats], mode:D.mode,
      start: D.mode==='days'?D.start:D.date, end: D.mode==='days'?D.end:D.date, date:D.mode==='hours'?D.date:'', dropT:D.dropT, pickT:D.pickT, startT:D.startT, hours:D.hours,
      addons:[...D.addons], food:Number(D.food)||0, insure:D.insure, couponOk:D.couponOk, usePoints:D.usePoints, notes:D.notes, pay:D.pay,
      price:q, status:'pending', escrow:'held', created:Date.now(), lastBy:Store.me };
    try { await Store.set('bookings/'+id, b); } catch(e){ closeModal(); return; }
    logAct('booking.create', id, (SIT[b.sitterId]?.name||'')+' · '+baht(b.price?.total));
    if (q.pts || D.couponOk){
      const w = {...WAL, log:[...(WAL.log||[])]};
      if (q.pts){ w.points -= q.pts; w.log.push({t:Date.now(), txt:'Used at checkout · '+id, p:-q.pts}); }
      if (D.couponOk) w.usedNewCoupon = true;
      Store.set(walletPath(), w).catch(()=>{});
    }
    D = null; closeModal(); UI.bkPane='overview';
    modal(`<div style="text-align:center"><div style="width:64px;height:64px;border-radius:50%;background:var(--green-s);color:var(--green);display:grid;place-items:center;margin:0 auto 12px;font-size:30px">✓</div><h2 class="h-m">Request sent · money held in escrow</h2><p class="sub small">Booking <b>${id}</b> is waiting for ${esc(shortName(s))} to accept. If they decline, ${baht(q.total)} is refunded automatically.</p><button class="btn btn-p btn-block" data-a="closeModal">View booking</button></div>`);
    go('booking-'+id);
  };
  if (D.pay==='promptpay' && q.total>0){
    modal(`<div style="text-align:center"><b>Scan to pay with PromptPay</b><div class="small muted" style="margin:2px 0 12px">THTCat Escrow (simulated)</div>${qrSVG(D.sitterId+q.total+Date.now())}<div style="font-family:'Bricolage Grotesque';font-size:28px;font-weight:800;margin-top:10px">${baht(q.total)}</div><div class="tiny muted" id="qrCount">QR expires in 05:00</div><button class="btn btn-o btn-block" style="margin-top:14px" id="simPaid">I've paid (simulate bank confirmation)</button><button class="btn btn-ghost btn-block" data-a="closeModal">Cancel</button></div>`);
    let left = 300; const iv = setInterval(()=>{ const el=$('#qrCount'); if(!el){clearInterval(iv);return;} left--; if (left<=0){ clearInterval(iv); closeModal(); toast('QR expired — try again'); return; } el.textContent='QR expires in '+pad2(Math.floor(left/60))+':'+pad2(left%60); },1000);
    $('#simPaid').onclick = function(){ this.innerHTML='<span class="spin"></span> Confirming with bank...'; this.disabled=true; setTimeout(()=>{ clearInterval(iv); finish(); },1200); };
  } else {
    btn.innerHTML = '<span class="spin"></span> Authorising...'; btn.disabled = true;
    setTimeout(finish, 1200);
  }
}

function startCCTV(){
  const cv = $('#cctv'); if (!cv) return; const x = cv.getContext('2d');
  let cam = 1; $$('[data-cam]').forEach(btn=>btn.onclick=()=>{ cam=+btn.dataset.cam; $$('[data-cam]').forEach(b=>b.classList.toggle('on',b===btn)); $('#camName').textContent = cam===1?'CAM 1 PLAY ZONE':'CAM 2 FEEDING'; });
  const t0 = performance.now();
  function frame(now){
    if (!document.body.contains(cv)) return;
    const t = (now-t0)/1000;
    x.fillStyle = cam===1?'#5d5a52':'#55584f'; x.fillRect(0,0,960,540);
    x.fillStyle = cam===1?'#7c7465':'#6f6c60'; x.fillRect(0,330,960,210);
    x.fillStyle='#9fb5bb'; x.fillRect(cam===1?640:120,70,200,160); x.strokeStyle='#ddd'; x.lineWidth=8; x.strokeRect(cam===1?640:120,70,200,160);
    if (cam===1){ x.fillStyle='#8a7a62'; x.fillRect(120,140,22,220); x.fillStyle='#6b5d4a'; [180,260,340].forEach(y=>x.fillRect(80,y,110,18)); }
    else { x.fillStyle='#ddd'; x.beginPath(); x.ellipse(520,430,46,14,0,0,7); x.fill(); x.beginPath(); x.ellipse(640,430,46,14,0,0,7); x.fill(); }
    const cx = cam===1? 480+Math.sin(t*.35)*230 : 560+Math.sin(t*.2)*30, cy = cam===1? 400+Math.sin(t*1.3)*6 : 405;
    const dir = cam===1? (Math.cos(t*.35)>0?1:-1) : 1;
    x.fillStyle='#2e2e2e'; x.beginPath(); x.ellipse(cx,cy,62,32,0,0,7); x.fill();
    x.beginPath(); x.arc(cx+dir*55,cy-26,26,0,7); x.fill();
    x.beginPath(); x.moveTo(cx+dir*38,cy-40); x.lineTo(cx+dir*42,cy-66); x.lineTo(cx+dir*56,cy-46); x.fill();
    x.beginPath(); x.moveTo(cx+dir*62,cy-46); x.lineTo(cx+dir*74,cy-66); x.lineTo(cx+dir*76,cy-38); x.fill();
    x.strokeStyle='#2e2e2e'; x.lineWidth=13; x.lineCap='round'; x.beginPath(); x.moveTo(cx-dir*58,cy); x.quadraticCurveTo(cx-dir*100,cy-20+Math.sin(t*3)*14,cx-dir*86,cy-70); x.stroke();
    for (let k=0;k<700;k++){ x.fillStyle=`rgba(255,255,255,${Math.random()*.06})`; x.fillRect(Math.random()*960,Math.random()*540,2,2); }
    const d = new Date(); const el = $('#camTime'); if (el) el.textContent = ymd(d)+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());
    cctvTimer = requestAnimationFrame(frame);
  }
  cctvTimer = requestAnimationFrame(frame);
}
function compressImage(file, max, stamp){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      let w=img.naturalWidth, h=img.naturalHeight; const r=Math.min(1, max/Math.max(w,h)); w=Math.round(w*r); h=Math.round(h*r);
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.drawImage(img,0,0,w,h);
      if (stamp){ x.fillStyle='rgba(0,0,0,.6)'; x.fillRect(0,h-28,w,28); x.fillStyle='#fff'; x.font='bold 14px monospace'; x.fillText(stamp, 10, h-9); }
      let q=0.75, d=c.toDataURL('image/jpeg', q); while (d.length>150000 && q>0.3){ q-=0.15; d=c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url); res(d);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('That file is not an image')); };
    img.src = url;
  });
}

async function toggleBlock(sid, ds){
  const s = SIT[sid]; const set = new Set(s.blocked||[]);

}
async function sitterAction(kind, id){
  const b = BK.find(x=>x.id===id); if (!b || !canManage(b.sitterId)) return;
  if (kind==='accept'){
    await Store.update('bookings/'+id, {status:'confirmed', tAccept:Date.now(), lastBy:Store.me});
    await Store.set('bookings/'+id+'/messages/'+rid('m'), {role:'sitter', by:Store.me, t:Date.now(), text:`Hi! I've accepted your booking 😊 See you on ${b.mode==='hours'?fmtD(b.date):fmtD(b.start)}.`}).catch(()=>{});
    toast('Booking accepted'); logAct('booking.accept', id, SIT[b.sitterId]?.name);
  }
  if (kind==='decline'){
    modal(`<h2 class="h-m">Decline this booking?</h2><p class="small sub">The customer gets a full refund from escrow.</p><select class="inp" id="declineReason"><option>Not available on these dates</option><option>Can't care for this cat's medical needs</option><option>Too many cats for my space</option><option>Other</option></select><div class="row between" style="margin-top:14px"><button class="btn btn-g" data-a="closeModal">Back</button><button class="btn btn-o" data-sact="declineYes" data-id="${id}">Decline & refund</button></div>`);
    return;
  }
  if (kind==='declineYes'){
    const reason = $('#declineReason')?.value || '';
    closeModal();
    await Store.update('bookings/'+id, {status:'declined', escrow:'refunded', tCancel:Date.now(), reason, lastBy:Store.me}); logAct('booking.decline', id, reason);
    toast('Declined · customer refunded');
  }
  if (kind==='checkin'){
    await Store.update('bookings/'+id, {status:'incare', tIn:Date.now(), lastBy:Store.me});
    toast('Care started — customer can now watch CCTV');
  }
}

}

async function adminAction(d){

    if (A==='ban'){ if (!ok) return confirmAdmin('Ban '+who+'?', 'They can still view the site but cannot book, apply as a sitter or send messages.', 'Ban user', {act:'ban', uid}, true); closeModal(); await Store.set('bans/'+uid, {reason:reason||'', by:Store.me, t:Date.now()}); toast('User banned'); logAct('admin.ban', uid, who+(reason?' · '+reason:'')); }
    if (A==='unban'){ await Store.del('bans/'+uid); toast('User unbanned'); logAct('admin.unban', uid, who); }
    if (A==='removeUser'){ if (!ok) return confirmAdmin('Remove '+who+'?', 'This deletes their public profile and sitter profile and bans the account. Their bookings stay for the records. This cannot be undone.', 'Remove user', {act:'removeUser', uid}, true); closeModal();
      await Store.set('bans/'+uid, {reason:reason||'Removed by admin', by:Store.me, t:Date.now()}); await Store.del('profiles/'+uid).catch(()=>{}); await Store.del('members/'+uid).catch(()=>{}); const sid='u-'+sanitize(uid); if (SIT[sid]) await Store.del('sitters/'+sid).catch(()=>{}); toast('User removed'); logAct('admin.remove', uid, who); }
    if (A==='userActs'){ UI.actUser=uid; UI.adminTab='activity'; UI.adminQ=''; render(); return; }

    if (A==='releaseBk'){ const b=BK.find(x=>x.id===id); if (!ok) return confirmAdmin('Release '+id+' to the sitter?', `${baht(b?.price?.sitterPay)} goes to the sitter and the booking is marked completed.`, 'Release payment', {act:'releaseBk', id}); closeModal(); await Store.update('bookings/'+id, {status:'completed', escrow:'released', tOut:Date.now(), disputeResolved:'release', lastBy:Store.me}); toast('Payment released'); logAct('admin.release', id, ''); }
    if (A==='delReview'){ const [sid, rvid]=id.split('/'); if (!ok) return confirmAdmin('Delete this review?', 'The review disappears from the sitter profile. This cannot be undone.', 'Delete review', {act:'delReview', id}); closeModal(); await Store.del('sitters/'+sid+'/reviews/'+rvid); toast('Review deleted'); logAct('admin.delReview', sid, rvid); }

async function completeBooking(id){
  const b = BK.find(x=>x.id===id); if (!b || b.ownerUid!==Store.me || b.status!=='incare') return;
  const q = b.price || quote(b), s = SIT[b.sitterId];
  const review = {stars:pickStars, text:($('#revText')?.value||'').trim() || 'Great stay!'};
  closeModal();
  await Store.update('bookings/'+id, {status:'completed', escrow:'released', tOut:Date.now(), review, lastBy:Store.me});
  await Store.set('sitters/'+b.sitterId+'/reviews/'+id, {stars:review.stars, text:review.text, by:Store.me, t:Date.now()}).catch(()=>{});
  if (s && Store.mode!=='supa'){ const n=(s.reviews||0)+1; await Store.update('sitters/'+b.sitterId, {reviews:n, rating:Math.round((((s.rating||0)*(s.reviews||0))+review.stars)/n*100)/100, done:(s.done||0)+1}).catch(()=>{}); }
  const w = {...WAL, log:[...(WAL.log||[])].slice(-80)}; w.points=(w.points||0)+q.earn; w.log.push({t:Date.now(), txt:'Completed stay with '+shortName(s), p:q.earn});
  await Store.set(walletPath(), w).catch(()=>{});
  toast('Payment released · +'+q.earn+' pts'); logAct('booking.complete', id, review.stars+'★ '+review.text);
}

/* =================== events =================== */
document.addEventListener('click', e=>{
  if (window._suppressClick && Date.now()-window._suppressClick<250){ e.preventDefault(); e.stopPropagation(); return; }
  const t = e.target.closest('[data-userf],[data-actf],[data-rule],[data-datepanel],[data-a],[data-go],[data-fav],[data-pick],[data-mnav],[data-mode],[data-cat],[data-editcat],[data-delcat],[data-pay],[data-food],[data-tab],[data-sact],[data-redeem],[data-admin],[data-chatas],[data-quick],[data-wi],[data-complete]');
  if (!t) return;
  const d = t.dataset;
  if (d.fav){ e.stopPropagation(); toggleFav(d.fav); return; }
  if (d.go){ go(d.go); return; }
  if (d.pick){ const P=PICK[d.pick]; if (P){ const st=dayState(P, d.day); if (st.off){ toast(st.why); return; } } pickDay(d.pick, d.day); return; }
  if (d.mnav){ const el=$('#months-'+d.for); if (el){ const w=el.firstElementChild?.offsetWidth||el.clientWidth; el.scrollBy({left:Number(d.mnav)*w, behavior:'smooth'}); } return; }
  if (d.wi!==undefined){ const w=t.parentElement; w.scrollTo({top:Number(d.wi)*IH, behavior:'smooth'}); return; }
  if (d.mode){ D.mode=d.mode; mountBookPanel(); return; }
  if (d.datepanel){ openDatePanel(d.datepanel); return; }
  if (d.rule){ ruleAction(d.rule); return; }
  if (d.quick!==undefined){
    const q = QUICK[+d.quick], P = PICK.search; let a, b;
    if (q[1]===null){ const now=new Date(); const sat=addDays(now,(6-now.getDay()+7)%7); a=ymd(sat); b=ymd(addDays(sat,2)); }
    else { a=ymd(addDays(new Date(),q[1])); b=ymd(addDays(parse(a),q[2])); }
    P.start=a; P.end=b; paintMonths('search'); paintSearchSummary(); scrollToMonth('search', a);
    $$('[data-quick]').forEach(c=>c.classList.toggle('on', c===t)); return;
  }
  if (d.cat){ const c=CATS.find(x=>x.id===d.cat); if (!c) return; if (catIssues(c).length){ toast(c.name+' can\'t be booked yet: '+catIssues(c).join(', ')); return; } const i=D.cats.indexOf(d.cat); i>=0?D.cats.splice(i,1):D.cats.push(d.cat); render(); return; }
  if (d.editcat){ e.stopPropagation(); catEditor(d.editcat); return; }
  if (d.delcat){ const list=CATS.filter(c=>c.id!==d.delcat); Store.set(catsPath(), {list}).then(()=>toast('Cat removed')).catch(()=>{}); return; }
  if (d.pay){ D.pay = d.pay; render(); return; }
  if (d.food!==undefined){ D.food = Number(d.food); render(); return; }
  if (d.tab){ const [k,v]=d.tab.split(':'); UI[k]=v; render(); return; }

  const btn = isResend ? $('#authResend') : $('#authSendBtn');
  if (!isResend){
    if ($('#authName')) AUTH.name = ($('#authName').value||'').trim().replace(/\s+/g,' ');
    AUTH.email = ($('#authEmail')?.value||'').trim().toLowerCase();
    AUTH.err=''; AUTH.nameErr=''; AUTH.noAccount=false;
    if (AUTH.tab==='signup' && AUTH.name.length<2){ AUTH.nameErr='Please enter your full name.'; paintAuth(); $('#authName')?.focus(); return; }
    if (!isEmail(AUTH.email)){ AUTH.err='Enter a valid email address, for example name@example.com.'; paintAuth(); $('#authEmail')?.focus(); return; }
    if (AUTH.tab==='login' && Store.mode!=='supa' && !(ACC && ACC.email===AUTH.email)){ AUTH.err='No account uses this email yet.'; AUTH.noAccount=true; paintAuth(); $('#authEmail')?.focus(); return; }
    if (AUTH.tab==='login' && ACC && ACC.email===AUTH.email && !AUTH.name) AUTH.name = ACC.name||'';
    try { localStorage.setItem('thtcat-email', AUTH.email); } catch(e){}
  } else if (AUTH.cool>0) return;
  AUTH.err=''; if (btn){ btn.disabled=true; btn.textContent='Sending…'; }
  const code = newCode();
  AUTH.otp = { hash: hashStr(code+'|'+AUTH.email), exp: Date.now()+OTP_TTL, tries:0 };
  const r = await deliverCode(AUTH.email, AUTH.name, code);
  if (r.error){ AUTH.err = r.error; AUTH.noAccount = !!r.noAccount; if (btn){ btn.disabled=false; btn.textContent = isResend?'Resend code':'Send code'; } if (!isResend){ AUTH.step=1; } paintAuth(); return; }
  AUTH.via = r.via; AUTH.note = r.note||''; if (r.via==='screen') AUTH.otp.shown = code;
  AUTH.step = 2; AUTH.cool = RESEND_S; paintAuth();
  clearInterval(AUTH.timer);
  AUTH.timer = setInterval(()=>{ AUTH.cool--; const b=$('#authResend'); if (!b){ clearInterval(AUTH.timer); return; } if (AUTH.cool<=0){ clearInterval(AUTH.timer); b.disabled=false; b.textContent='Resend code'; } else b.textContent='Resend in '+AUTH.cool+'s'; }, 1000);
  if (isResend) toast(r.via==='gmail' ? 'New code sent' : 'New code ready');
}
async function deliverCode(email, name, code){
  if (Store.mode==='supa'){
    const login = AUTH.tab==='login';
    const { error } = await SUPA.client.auth.signInWithOtp({ email, options: login ? { shouldCreateUser:false } : { shouldCreateUser:true, data:{ full_name:name } } });
    if (error){
      if (login && /signups? not allowed|not found|user not/i.test(error.message)) return { via:'server', error:'No account uses this email yet.', noAccount:true };
      return { via:'server', note:'', error: /rate|seconds|security purposes/i.test(error.message) ? 'Too many codes requested. Wait a minute, then press Resend.' : ('Could not send the code: '+error.message) };
    }
    return { via:'gmail', note:'Sent by THTCat. It can take up to a minute.' };
  }
  const mcp = await getMcp();
  const screen = note => ({ via:'screen', note });
  if (!mcp) return screen('Demo mode: email sending works only for members of this THTCat workspace. Use this code to continue.');
  const html = `<div style="font-family:Arial,sans-serif;max-width:420px;margin:auto;padding:24px;border:1px solid #e8e1d7;border-radius:14px">
    <h2 style="color:#0e6b66;margin:0 0 8px">THTCat verification code</h2>
    <p>Hi ${esc(name)}, use this code to confirm your email address:</p>
    <p style="font-size:32px;letter-spacing:8px;font-weight:700;color:#1c2a2e;margin:16px 0">${code}</p>
    <p style="color:#4d5d62;font-size:13px">The code expires in 10 minutes. If you did not request it, you can ignore this email.</p></div>`;
  try {
    await mcp.callTool('Gmail', 'send_message', { to:[email], subject:'Your THTCat code: '+code, body:`Hi ${name},\n\nYour THTCat verification code is ${code}.\nIt expires in 10 minutes.\n\nIf you did not request it, you can ignore this email.`, htmlBody:html }, { cache:false });
    return { via:'gmail', note:'Sent from your connected Gmail account.' };
  } catch(err){
    const c = err && err.code;
    if (c==='server_not_connected' || c==='selection_required') return screen('Gmail is not connected for this account (claude.ai Settings › Connectors). Demo code shown instead.');
    if (c==='needs_reauth') return screen('Your Gmail connection has expired. Reconnect Gmail in claude.ai Settings › Connectors. Demo code shown instead.');
    if (c==='approval_required' || c==='not_in_manifest' || c==='consent_required') return screen('Sending email needs your permission for Gmail. Allow it when asked, then press Resend. Demo code shown meanwhile.');
    if (c==='blocked_by_policy') return screen('Your organisation blocks sending email from this page. Demo code shown instead.');
    if (c==='server_unavailable' || c==='upstream_error') return { via:'gmail', note:'Gmail was slow to answer. The email may still arrive; if not, press Resend in a minute.' };
    return screen('The email could not be sent ('+(c||'error')+'). Demo code shown instead.');
  }
}
async function authVerify(){
  const v = ($('#authCode')?.value||'').replace(/\D/g,'');
  const o = AUTH.otp;
  if (Store.mode==='supa') return supaVerify(v);
  if (!o){ AUTH.step=1; paintAuth(); return; }
  if (Date.now()>o.exp){ AUTH.err='This code has expired. Press Resend code.'; paintAuth(); return; }
  if (o.tries>=OTP_TRIES){ AUTH.err='Too many attempts. Press Resend code for a new one.'; paintAuth(); return; }
  if (v.length!==6){ AUTH.err='Enter all 6 digits.'; paintAuth(); return; }
  if (hashStr(v+'|'+AUTH.email)!==o.hash){ o.tries++; AUTH.err=`That code is not right. ${OTP_TRIES-o.tries} tries left.`; paintAuth(); return; }
  const btn=$('#authVerifyBtn'); if (btn){ btn.disabled=true; btn.textContent='Verifying…'; }
  const prof = { email:AUTH.email, name:AUTH.name || (ACC&&ACC.name) || AUTH.email.split('@')[0], verified:true, verifiedAt:Date.now(), via:AUTH.via, mode:UI.mode };
  try { await Store.set(profilePath(), prof); } catch(e){ if (btn){ btn.disabled=false; btn.textContent='Verify and continue'; } AUTH.err='Could not save your account. Try again.'; paintAuth(); return; }
  ACC = prof; clearInterval(AUTH.timer); AUTH.otp=null; logAct(AUTH.tab==='login'?'auth.login':'auth.signup', AUTH.email, ''); touchMember();
  closeModal(); updateChrome(); toast(AUTH.tab==='login' ? 'Welcome back, '+prof.name.split(' ')[0] : 'Welcome, '+prof.name.split(' ')[0]+'! Your account is ready');
  const then = AUTH.then; AUTH.then=null; if (then) setTimeout(then, 60); else render(true);
}
async function supaVerify(v){
  if (v.length!==6){ AUTH.err='Enter all 6 digits.'; paintAuth(); return; }
  const btn=$('#authVerifyBtn'); if (btn){ btn.disabled=true; btn.textContent='Verifying…'; }
  const { data, error } = await SUPA.client.auth.verifyOtp({ email:AUTH.email, token:v, type:'email' });
  if (error || !data?.user){ AUTH.err = 'That code is wrong or has expired. Use the code in the latest email, or press Resend code.'; paintAuth(); return; }
  const uid = data.user.id;
  if (AUTH.tab==='signup') await SUPA.client.from('docs').upsert([{path:'data/users/'+uid+'/profile', parent:'data/users/'+uid, data:{email:AUTH.email, name:AUTH.name, verified:true, verifiedAt:Date.now(), via:'supabase', mode:UI.mode}}, {path:'profiles/'+uid, parent:'profiles', data:{name:AUTH.name}}]);
  try { sessionStorage.setItem('thtcat-justauth', AUTH.tab); } catch(e){}
  if (AUTH.then){ try { sessionStorage.setItem('thtcat-resume', JSON.stringify({ D, hash: D ? 'checkout' : null })); } catch(e){} }
  location.reload();
}
function googleSignIn(){ SUPA.client.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + location.pathname } }); }
function accountModal(){
  const em = (ACC&&ACC.email) || SUPA.user?.email || '';
  const nm = (ACC&&ACC.name) || SUPA.user?.user_metadata?.full_name || em.split('@')[0];
  const ms = mySitter();
  modal(`<div class="auth-head"><div class="auth-ic" aria-hidden="true">${esc((nm||'?')[0].toUpperCase())}</div><div><h2 class="h-m">My account</h2><p class="small sub">${esc(em)} <span class="badge b-green">Verified</span></p></div></div>
    <label class="lbl" for="accName">Display name</label>
    <div class="row" style="gap:8px"><input class="inp" id="accName" autocomplete="name" maxlength="60" value="${esc(nm)}" aria-describedby="accErr"><button class="btn btn-g" type="button" data-a="saveName" style="min-height:44px">Save</button></div>
    <div class="field-err" id="accErr" role="alert"></div>
    <div class="lbl">Use THTCat as</div>
    <div class="mode-switch big" role="group" aria-label="Choose how you use THTCat"><button type="button" data-a="setModeCustomer" aria-pressed="${UI.mode==='customer'}">Cat owner</button><button type="button" data-a="setModeSitter" aria-pressed="${UI.mode==='sitter'}">Sitter</button></div>
    <div class="acc-links">
      <a href="#bookings" data-a="closeModal">My bookings</a>
      <a href="#rewards" data-a="closeModal">Rewards and points</a>
      <a href="#${ms?'sitter-dashboard:requests':'become-sitter'}" data-a="closeModal">${ms?'Sitter dashboard':'Become a sitter'}</a>
      ${Store.isAdmin?'<a href="#admin" data-a="closeModal">Admin</a>':''}
    </div>
    <div class="row between" style="margin-top:16px"><button class="btn btn-g" type="button" data-a="signOut">Log out</button><button class="btn btn-p" type="button" data-a="closeModal">Done</button></div>`);
}
async function saveName(){
  const v = ($('#accName')?.value||'').trim().replace(/\s+/g,' ');
  if (v.length<2){ $('#accErr').textContent='Please enter at least 2 characters.'; $('#accName').setAttribute('aria-invalid','true'); return; }
  try {
    if (ACC) await Store.update(profilePath(), {name:v}); else await Store.set(profilePath(), {email:SUPA.user?.email||'', name:v, verified:true, verifiedAt:Date.now(), mode:UI.mode});
    if (Store.mode==='supa') await Store.set('profiles/'+Store.me, {name:v});
    if (ACC) ACC.name=v; NAMES[Store.me]=v; updateChrome(); toast('Name saved'); closeModal();
  } catch(e){ $('#accErr').textContent='Could not save. Try again.'; }
}
document.addEventListener('keydown', e=>{
  if (e.key==='Enter' && e.target.closest && e.target.closest('#authBox')){ e.preventDefault(); AUTH.step===1 ? authSend() : authVerify(); }
  if (e.key==='Escape' && $('#modalRoot').innerHTML) closeModal();
});
document.addEventListener('input', e=>{ if (e.target.id==='authCode'){ const v=e.target.value.replace(/\D/g,'').slice(0,6); if (v!==e.target.value) e.target.value=v; if (v.length===6) authVerify(); } });

render(false);
boot().then(()=>render(false)).catch(err=>{ console.error(err); Store.mode='local'; Store.me='local-user'; Store.isAdmin=true; lsLoad(); subscribeAll(); updateChrome(); });

</script>
